# Fly.io config for the Locus Django + PostGIS API.
# Deploy from this folder:  fly deploy
# App names are global on Fly; change `app` if this one is taken.
app = "locus-memories-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs on a temporary machine before each release (no volume attached, which is fine for migrations).
  release_command = "python manage.py migrate --noinput"

[env]
  DJANGO_DEBUG = "False"
  DJANGO_ALLOWED_HOSTS = "locus-memories-api.fly.dev"
  DJANGO_CSRF_TRUSTED_ORIGINS = "https://locus-memories-api.fly.dev"
  DJANGO_SERVE_MEDIA = "True"
  MEDIA_ROOT = "/data/media"
  LOG_DIR = "/data/logs"
  # Secrets (set with `fly secrets set`, never here): DJANGO_SECRET_KEY, DATABASE_URL
  # DATABASE_URL points at the private PostGIS app: postgres://locus_user:<pw>@locus-postgis.internal:5432/locus

[mounts]
  source = "locus_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep one machine always on so the app answers instantly while you're testing in the field.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
